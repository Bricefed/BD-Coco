name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les poussées suivantes remplacent la précédente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Seuls les fichiers du site partent en ligne : ni le SQL, ni la copie
      # de référence de l'application.
      - name: Rassembler le site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets covers _site/
          touch _site/.nojekyll

          # GitHub Pages sert les assets avec max-age=600 : sans empreinte, un
          # navigateur rejoue l'ancien JS pendant dix minutes après un
          # déploiement. Le numéro de commit dans l'URL force le rechargement.
          V="${GITHUB_SHA::8}"
          sed -i \
            -e "s|assets/styles\.css|assets/styles.css?v=$V|" \
            -e "s|assets/config\.js|assets/config.js?v=$V|" \
            -e "s|assets/app\.js|assets/app.js?v=$V|" \
            _site/index.html
          echo "Version des assets : $V"
          grep -o 'assets/[a-z.]*\.[a-z]*?v=[0-9a-f]*' _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
