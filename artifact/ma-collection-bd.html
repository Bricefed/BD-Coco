<title>Ma collection de BD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&display=swap">

<style>
/* Layout : application à écran unique pensée pour le pouce — recherche collante
   en haut, contenu défilant, barre d'onglets fixée en bas. L'étagère est le motif
   central : les couvertures en grille, et sous chacune la part déjà rentrée. */
:root{
  --paper:#EFEDE6; --card:#FFFFFF; --card-2:#F7F5F0; --sunk:#E4E1D8;
  --ink:#141B26; --ink-2:#5B6573; --rule:#D8D5CA;
  --blue:#1F4E79; --gold:#B8801C;
  --have:#2C6A4E; --have-bg:#E2EDE6;
  --want:#A1362A; --want-bg:#F3E3E0;
  --on-blue:#FFFFFF; --on-have:#FFFFFF; --on-cover:#FFFFFF;
  --shadow:0 1px 2px rgba(20,27,38,.07), 0 6px 18px -10px rgba(20,27,38,.22);
  --shadow-lift:0 2px 6px rgba(20,27,38,.12), 0 14px 30px -14px rgba(20,27,38,.34);
  --f-disp:"Big Shoulders Display","Haettenschweiler","Arial Narrow",sans-serif;
  --f-body:"Public Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#111823; --card:#1A212C; --card-2:#202833; --sunk:#0C121B;
  --ink:#E9E7E0; --ink-2:#97A2B2; --rule:#2C3542;
  --blue:#84ACD8; --gold:#DFA93E;
  --have:#6BAE88; --have-bg:#1B2E26;
  --want:#DD8574; --want-bg:#2F201E;
  --on-blue:#0D141D; --on-have:#0C1813; --on-cover:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 14px 30px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111823; --card:#1A212C; --card-2:#202833; --sunk:#0C121B;
  --ink:#E9E7E0; --ink-2:#97A2B2; --rule:#2C3542;
  --blue:#84ACD8; --gold:#DFA93E;
  --have:#6BAE88; --have-bg:#1B2E26;
  --want:#DD8574; --want-bg:#2F201E;
  --on-blue:#0D141D; --on-have:#0C1813; --on-cover:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 14px 30px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 16px/1.45 var(--f-body);
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  background:var(--card);z-index:30}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
img{display:block}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- bandeau haut ---------- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--card); border-bottom:1px solid var(--rule)}
.top-in{max-width:760px; margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 12px; display:flex; flex-direction:column; gap:10px}
.brand{display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand h1{font:600 26px/.95 var(--f-disp); letter-spacing:.015em; text-transform:uppercase}
.tally{margin:0; font-size:13px; color:var(--ink-2); white-space:nowrap}
.tally b{font:800 20px/1 var(--f-disp); color:var(--blue); font-variant-numeric:tabular-nums}

.search{position:relative; display:flex}
.search input{width:100%; min-width:0; font:500 17px/1 var(--f-body); color:var(--ink);
  background:var(--card-2); border:1.5px solid var(--rule); border-radius:13px;
  padding:14px 46px 14px 43px; appearance:none}
.search input::placeholder{color:var(--ink-2); font-weight:400}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--blue); outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.search .ico{position:absolute; left:14px; top:50%; translate:0 -50%; color:var(--ink-2);
  pointer-events:none; display:flex}
.search .clr{position:absolute; right:5px; top:50%; translate:0 -50%; width:38px; height:38px;
  border-radius:50%; color:var(--ink-2); font-size:21px; line-height:1; display:grid; place-items:center}
.sync{margin:0; font-size:12.5px; color:var(--ink-2); display:flex; align-items:center; gap:6px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--have);flex:none}
.sync[data-s="local"] .dot{background:var(--gold)}
.sync[data-s="saving"] .dot{background:var(--blue)}

/* ---------- contenu ---------- */
main{max-width:760px; margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(86px + env(safe-area-inset-bottom,0px))}
.eyebrow{font:600 12px/1 var(--f-body); text-transform:uppercase; letter-spacing:.1em;
  color:var(--ink-2); margin:0 0 9px}
.hint{color:var(--ink-2); font-size:14.5px; margin:0 0 14px}
.hint b{color:var(--ink)}

.chips{display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; scrollbar-width:none;
  padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; padding:10px 15px; border-radius:999px; border:1.5px solid var(--rule);
  background:var(--card); font-size:14.5px; font-weight:500; color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:var(--on-blue)}
.chip .n{font-variant-numeric:tabular-nums; opacity:.7; margin-left:5px}

/* ---------- étagère ---------- */
.shelf{display:grid; grid-template-columns:repeat(2,1fr); gap:14px 12px;
  list-style:none; margin:0; padding:0}
@media (min-width:480px){ .shelf{grid-template-columns:repeat(3,1fr)} }
@media (min-width:680px){ .shelf{grid-template-columns:repeat(4,1fr)} }

.tile{width:100%; text-align:left; display:flex; flex-direction:column; gap:7px}
.tile .art{position:relative; aspect-ratio:2/3; border-radius:11px; overflow:hidden;
  background:var(--sunk); box-shadow:var(--shadow); transition:box-shadow .15s, transform .15s}
.tile:active .art{transform:scale(.975)}
.tile .art img{width:100%; height:100%; object-fit:cover}
/* Sans couverture : le nom en haut, l'initiale en filigrane en bas — le compteur
   occupe déjà le bas de la vignette. */
.tile .ph{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-start;
  padding:11px 11px 0; color:#fff; overflow:hidden}
.tile .ph i{position:absolute; right:-10px; bottom:-30px; font:800 124px/1 var(--f-disp);
  opacity:.2; font-style:normal; letter-spacing:-.03em}
.tile .ph span{position:relative; font:600 16px/1.1 var(--f-disp); text-transform:uppercase;
  letter-spacing:.02em}
.tile .veil{position:absolute; inset:auto 0 0; height:58%; pointer-events:none;
  background:linear-gradient(to top,rgba(10,14,20,.88) 0%,rgba(10,14,20,.55) 42%,transparent 100%)}
.tile .on-art{position:absolute; inset:auto 0 0; padding:9px 10px 10px; color:var(--on-cover)}
.tile .bar{display:block; height:5px; border-radius:3px; background:rgba(255,255,255,.32); overflow:hidden}
.tile .bar i{display:block; height:100%; background:#fff; border-radius:3px}
.tile .cnt{display:block; font-size:12.5px; font-weight:600; margin-top:5px;
  font-variant-numeric:tabular-nums; text-shadow:0 1px 3px rgba(0,0,0,.5)}
.tile .name{font-weight:600; font-size:14.5px; line-height:1.25; color:var(--ink)}
.tile .flag{position:absolute; top:8px; right:8px; background:var(--have); color:var(--on-have);
  border-radius:50%; width:26px; height:26px; display:grid; place-items:center;
  box-shadow:0 2px 6px rgba(0,0,0,.35)}

.tile.add .art{display:grid; place-items:center; background:var(--card);
  border:2px dashed var(--rule); box-shadow:none; color:var(--ink-2)}
.tile.add .art span{font-weight:600; font-size:14px; text-align:center; padding:0 10px; margin-top:8px}
.tile.add:active .art{border-color:var(--blue); color:var(--blue)}

/* ---------- détail d'une série ---------- */
.hero{display:flex; gap:14px; margin-bottom:6px}
.hero .art{flex:none; width:108px; aspect-ratio:2/3; border-radius:10px; overflow:hidden;
  background:var(--sunk); box-shadow:var(--shadow-lift); position:relative}
.hero .art img{width:100%; height:100%; object-fit:cover}
.hero .meta{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:9px}
.hero h2{font:600 28px/.98 var(--f-disp); text-transform:uppercase; letter-spacing:.015em}
.hero .sub{font-size:14.5px; color:var(--ink-2); margin:0}
.hero .sub b{font:800 25px/1 var(--f-disp); color:var(--blue); font-variant-numeric:tabular-nums;
  margin-right:4px}
.pbar{display:block; height:9px; border-radius:5px; background:var(--sunk); overflow:hidden}
.pbar i{display:block; height:100%; background:var(--blue); border-radius:5px; transition:width .25s}
.pbar.full i{background:var(--have)}

.back{display:inline-flex; align-items:center; gap:7px; font-weight:600; font-size:15px;
  color:var(--blue); padding:10px 13px 10px 8px; margin:0 0 10px -8px; border-radius:10px}
.section-label{font:600 12px/1 var(--f-body); text-transform:uppercase; letter-spacing:.1em;
  color:var(--gold); margin:24px 0 9px; padding-top:15px; border-top:1px solid var(--rule)}
.section-label.plain{color:var(--ink-2); border-top-color:transparent; padding-top:4px}

/* ---------- lignes d'album ---------- */
.albums{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.albums.fade li{transition:opacity .2s, transform .2s}
.al{width:100%; display:flex; align-items:center; gap:13px; text-align:left;
  background:var(--card); border:1px solid var(--rule); border-radius:12px;
  padding:12px 14px; min-height:60px; transition:background .12s,border-color .12s,transform .1s}
.al:active{transform:scale(.99)}
.al .num{flex:none; min-width:30px; font-variant-numeric:tabular-nums; font-weight:600;
  font-size:14px; color:var(--ink-2); text-align:right}
.al .ttl{flex:1; min-width:0; font-size:16.5px; line-height:1.3; text-wrap:pretty}
.al .srs{display:block; font-size:13.5px; color:var(--ink-2); margin-top:2px}
.al .tick{flex:none; width:31px; height:31px; border-radius:50%; border:2px solid var(--rule);
  display:grid; place-items:center; color:transparent; transition:background .12s,border-color .12s}
.al[aria-pressed="true"]{background:var(--have-bg);
  border-color:color-mix(in srgb,var(--have) 35%,transparent)}
.al[aria-pressed="true"] .num{color:var(--have)}
.al[aria-pressed="true"] .ttl{font-weight:500}
.al[aria-pressed="true"] .tick{background:var(--have); border-color:var(--have); color:var(--on-have)}
.verdict{flex:none; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  padding:6px 9px; border-radius:7px; white-space:nowrap; color:var(--want); background:var(--want-bg)}
.al[aria-pressed="true"] .verdict{color:var(--have); background:var(--card)}

.group-head{display:flex; align-items:center; gap:10px; margin:22px 0 9px; padding-top:15px;
  border-top:1px solid var(--rule)}
.group-head .thumb{flex:none; width:34px; aspect-ratio:2/3; border-radius:5px; overflow:hidden;
  background:var(--sunk)}
.group-head .thumb img{width:100%; height:100%; object-fit:cover}
.group-head .gt{flex:1; min-width:0; font-weight:600; font-size:15.5px}
.group-head .gn{font-size:13px; color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums}

/* ---------- formulaires / panneau ---------- */
#add-serie{scroll-margin-top:170px}
.panel{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:16px;
  box-shadow:var(--shadow); display:grid; gap:12px; margin-bottom:16px}
.panel h3{font:600 22px/1 var(--f-disp); text-transform:uppercase; letter-spacing:.015em}
.field{display:flex; gap:9px}
input[type=text]{font:400 16.5px var(--f-body); color:var(--ink); background:var(--card-2);
  border:1.5px solid var(--rule); border-radius:11px; padding:13px; min-width:0; flex:1}
input[type=text]:focus{border-color:var(--blue); outline:none}
input.num{width:72px; flex:none; text-align:center; font-variant-numeric:tabular-nums}
textarea{font:400 16px/1.45 var(--f-body); color:var(--ink); background:var(--card-2);
  border:1.5px solid var(--rule); border-radius:11px; padding:12px; width:100%;
  min-height:112px; resize:vertical}
textarea:focus{border-color:var(--blue); outline:none}
details{border-top:1px solid var(--rule); padding-top:10px}
details summary{cursor:pointer; font-size:14.5px; font-weight:600; color:var(--blue);
  padding:6px 0; list-style:none; min-height:36px; display:flex; align-items:center}
details summary::-webkit-details-marker{display:none}
.ae-add{flex:none; width:54px; padding:0; display:grid; place-items:center; font-size:24px;
  color:var(--blue); line-height:1}
.btns{display:flex; gap:9px; flex-wrap:wrap}
.btn{padding:13px 18px; border-radius:11px; font-weight:600; font-size:15px;
  border:1.5px solid var(--rule); min-height:48px}
.btn.pri{background:var(--blue); border-color:var(--blue); color:var(--on-blue)}
.btn.pri:disabled{opacity:.45; cursor:default}
.btn.wide{flex:1; justify-content:center; display:flex; align-items:center; gap:7px}
.btn.danger{color:var(--want); border-color:color-mix(in srgb,var(--want) 40%,transparent)}
.note{font-size:13.5px; color:var(--ink-2); margin:0; line-height:1.4}
.note.warn{color:var(--gold); font-weight:500}
.spin{width:17px;height:17px;border:2.5px solid var(--rule);border-top-color:var(--blue);
  border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.prop{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;
  max-height:46vh; overflow:auto; -webkit-overflow-scrolling:touch}
.prop li{display:flex; align-items:center; gap:10px; background:var(--card-2);
  border:1px solid var(--rule); border-radius:10px; padding:10px 12px}
.prop .pn{font-variant-numeric:tabular-nums; font-weight:600; font-size:13.5px; color:var(--ink-2);
  min-width:24px; text-align:right}
.prop .pt{flex:1; min-width:0; font-size:15.5px}
.prop .rm{flex:none; width:34px; height:34px; border-radius:50%; color:var(--ink-2); font-size:19px;
  display:grid; place-items:center}

/* ---------- bilan ---------- */
.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:24px}
.stat{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:15px;
  box-shadow:var(--shadow)}
.stat .k{font:800 38px/.9 var(--f-disp); color:var(--blue); font-variant-numeric:tabular-nums}
.stat .l{font-size:13px; color:var(--ink-2); margin-top:5px}
.stat.gold .k{color:var(--gold)}
.stat.have .k{color:var(--have)}

.empty{text-align:center; color:var(--ink-2); padding:48px 16px; font-size:15.5px}
.empty strong{display:block; color:var(--ink); font-size:18px; margin-bottom:6px; font-weight:600}

/* ---------- onglets ---------- */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--card);
  border-top:1px solid var(--rule); display:flex;
  padding-left:max(8px,env(safe-area-inset-left,0px));
  padding-right:max(8px,env(safe-area-inset-right,0px));
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:10px 4px 11px; color:var(--ink-2); font-size:12px; font-weight:600}
.tab svg{width:23px; height:23px}
.tab[aria-current="page"]{color:var(--blue)}
.tab .cnt{font-variant-numeric:tabular-nums}

@media (min-width:560px){ .brand h1{font-size:32px} .hero h2{font-size:34px} .hero .art{width:132px}
  .stats{grid-template-columns:repeat(4,1fr)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Ma collection de BD</h1>
      <p class="tally"><b id="t-own">—</b> / <span class="tnum" id="t-tot">—</span></p>
    </div>
    <div class="search">
      <span class="ico" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></span>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search"
             placeholder="Un titre ? Tapez-le ici" aria-label="Chercher un album ou une série">
      <button class="clr" id="q-clear" hidden aria-label="Effacer la recherche">×</button>
    </div>
    <p class="sync" id="sync" data-s="local"><span class="dot"></span><span id="sync-t">Chargement…</span></p>
  </div>
</header>

<main id="main">
  <section id="v-search" hidden aria-label="Résultats de recherche"></section>
  <section id="v-shelf" hidden aria-label="Ma collection"></section>
  <section id="v-detail" hidden aria-label="Détail d'une série"></section>
  <section id="v-missing" hidden aria-label="Albums à trouver"></section>
  <section id="v-stats" hidden aria-label="Bilan"></section>
</main>

<nav class="tabs" aria-label="Navigation">
  <button class="tab" data-tab="shelf" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h5v16H4zM10.5 4h5v16h-5z"/><path d="m17 4.6 4 1.1-3.4 15.1-4-1.1z"/></svg>
    <span>Ma collection</span>
  </button>
  <button class="tab" data-tab="missing">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 12h14M5 17h7"/><path d="M17.5 15.5v5M15 18h5"/></svg>
    <span>À trouver <span class="cnt" id="tab-missing"></span></span>
  </button>
  <button class="tab" data-tab="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Bilan</span>
  </button>

/* ================= état =================
   owned  : id de série -> Set des clés d'albums possédés (clé « bloc.numéro »,
            car les sous-collections repartent à l'album n°1).
   extra  : id de série -> albums ajoutés un par un {n, t, o}
   added  : séries entières ajoutées depuis l'application (collection « custom »)
   stamp  : date de la dernière modification locale, pour qu'une version plus
            ancienne du serveur n'écrase pas ce qui a été coché hors connexion. */
const owned = new Map(), extra = new Map(), added = new Map(), stamp = new Map();
const CAT = new Map(CATALOGUE.map(s => [s.id, s]));

for (const s of CATALOGUE) {
  owned.set(s.id, new Set(s.albums.filter(a => a.o).map(a => a.k)));
  extra.set(s.id, []);
}

let db = null, canWrite = null, sampler;
let view = { name: 'shelf', id: null };
let filter = 'all', query = '', adding = null;
const LS = 'bd.v2';

const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const byName = (a, b) => norm(a.name).localeCompare(norm(b.name), 'fr');

const serie = id => CAT.get(id) || added.get(id);
const allSeries = () => [...CATALOGUE, ...added.values()].sort(byName);
const ensure = id => {
  if (!owned.has(id)) owned.set(id, new Set());
  if (!extra.has(id)) extra.set(id, []);
};
const total = s => s.albums.length + (extra.get(s.id) || []).length;
const count = s => (owned.get(s.id) || new Set()).size
  + (extra.get(s.id) || []).filter(a => a.o).length;
const missingOf = s => [
  ...s.albums.filter(a => !owned.get(s.id).has(a.k)).map(a => ({ ...a, sid: s.id })),
  ...(extra.get(s.id) || []).map((a, i) => ({ ...a, sid: s.id, xi: i })).filter(a => !a.o),
];
const slug = n => norm(n).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'serie';

/* ================= persistance ================= */
function snapshot() {
  const o = {};
  for (const s of allSeries()) o[s.id] = {
    owned: [...(owned.get(s.id) || [])], extra: extra.get(s.id) || [], at: stamp.get(s.id) || 0,
  };
  return { state: o, added: [...added.values()] };
}
const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(snapshot())); } catch (e) {} };
const readLocal = () => { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } };

function applyState(id, d, fromDb) {
  if (!serie(id) || !d) return false;
  const at = Number(d.at) || 0;
  if (fromDb && at < (stamp.get(id) || 0)) return false;
  ensure(id);
  if (Array.isArray(d.owned)) owned.set(id, new Set(d.owned.filter(k => typeof k === 'string')));
  if (Array.isArray(d.extra)) extra.set(id, d.extra
    .filter(a => a && typeof a.t === 'string')
    .map(a => ({ n: Number(a.n) || 0, t: a.t, o: a.o !== false })));
  stamp.set(id, at);
  return true;
}
function applyAdded(d) {
  if (!d || typeof d.name !== 'string' || !Array.isArray(d.albums)) return false;
  const id = String(d.id || slug(d.name));
  if (CAT.has(id)) return false;
  added.set(id, { id, name: d.name, custom: true,
    albums: d.albums.filter(a => a && typeof a.t === 'string')
      .map((a, i) => ({ k: String(a.k || `0.${a.n || i + 1}`), n: Number(a.n) || i + 1, t: a.t, s: null })) });
  ensure(id);
  return true;
}

const pending = new Map();
function queueWrite(id) {
  stamp.set(id, Date.now());
  saveLocal();
  if (!db || canWrite === false) return;
  clearTimeout(pending.get(id));
  setSync('saving');
  pending.set(id, setTimeout(async () => {
    pending.delete(id);
    try {
      await db.doc('series/' + id).set({
        owned: [...owned.get(id)].sort(), extra: extra.get(id), at: stamp.get(id) || Date.now(),
      });
      if (!pending.size) setSync('ok');
    } catch (e) {
      if (e && e.code === 'invalid_argument') { canWrite = false; setSync('local'); }
      else setSync('retry');
    }
  }, 450));
}

function setSync(state) {
  const el = document.getElementById('sync'), t = document.getElementById('sync-t');
  const msg = { ok: 'Tout est enregistré', saving: 'Enregistrement…',
    local: 'Enregistré sur cet appareil seulement', retry: 'Enregistrement impossible pour l’instant' };
  el.dataset.s = (state === 'ok' || state === 'saving') ? state : 'local';
  t.textContent = msg[state] || '';
}

/* ================= visuels ================= */
const TINTS = ['#1F4E79', '#8A4B2A', '#2C6A4E', '#6B3A6E', '#9C6B13', '#2B5E6B', '#7A2E3C', '#3F5330'];
const tint = id => TINTS[[...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % TINTS.length];
const initial = n => (norm(n).replace(/^(le|la|les|l|un|une|des) /, '')[0] || '?').toUpperCase();

function art(s, cls) {
  if (s.cover) return `<img src="/_blob/${esc(s.cover)}" alt="" loading="lazy" decoding="async">`;
  return `<span class="ph" style="background:${tint(s.id)}">
      <i aria-hidden="true">${esc(initial(s.name))}</i><span>${esc(s.name)}</span></span>`;
}

const CHECK = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5L20 7"/></svg>`;

/* ================= rendu ================= */
function albumRow(a, sid, o = {}) {
  const sub = o.series ? `<span class="srs">${esc(serie(sid).name)}</span>` : '';
  const right = o.verdict
    ? `<span class="verdict">${o.on ? 'Vous l’avez' : 'Pas encore'}</span>`
    : `<span class="tick" aria-hidden="true">${CHECK}</span>`;
  return `<li><button class="al" role="switch" aria-pressed="${o.on}"
      data-s="${esc(sid)}" data-k="${esc(a.k || '')}"${a.xi != null ? ` data-x="${a.xi}"` : ''}>
      <span class="num tnum">${a.n || '•'}</span>
      <span class="ttl">${esc(a.t)}${sub}</span>${right}</button></li>`;
}

function tile(s) {
  const c = count(s), t = total(s), done = c >= t && t > 0;
  return `<li><button class="tile" data-go="${esc(s.id)}">
    <span class="art">${art(s)}
      <span class="veil" aria-hidden="true"></span>
      ${done ? `<span class="flag" aria-hidden="true">${CHECK}</span>` : ''}
      <span class="on-art">
        <span class="bar" aria-hidden="true"><i style="width:${t ? (c / t * 100).toFixed(1) : 0}%"></i></span>
        <span class="cnt">${done ? 'Complète' : `${c} / ${t}`}</span>
      </span></span>
    <span class="name">${esc(s.name)}</span></button></li>`;
}

function renderShelf() {
  const all = allSeries();
  const list = all.filter(s => filter === 'all'
    || (filter === 'todo' ? count(s) < total(s) : count(s) >= total(s)));
  const todo = all.filter(s => count(s) < total(s)).length;
  document.getElementById('v-shelf').innerHTML = `
    <div class="chips" role="group" aria-label="Filtrer">
      ${[['all', 'Toutes', all.length], ['todo', 'À compléter', todo], ['done', 'Complètes', all.length - todo]]
      .map(([k, l, n]) => `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${l}<span class="n tnum">${n}</span></button>`).join('')}
    </div>
    <ul class="shelf">
      <li><button class="tile add" data-add-serie>
        <span class="art"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Ajouter une série</span></span></button></li>
      ${list.map(tile).join('')}
    </ul>`;
}

function renderDetail() {
  const s = serie(view.id);
  if (!s) { view = { name: 'shelf', id: null }; return renderShelf(); }
  const set = owned.get(s.id), c = count(s), t = total(s);
  const blocks = [];
  for (const a of s.albums) {
    const bi = String(a.k).split('.')[0];
    if (!blocks.length || blocks[blocks.length - 1].bi !== bi)
      blocks.push({ bi, label: a.s || null, rows: [] });
    blocks[blocks.length - 1].rows.push(albumRow(a, s.id, { on: set.has(a.k) }));
  }
  const ex = extra.get(s.id) || [];
  if (ex.length) blocks.push({ bi: 'x', label: 'Mes ajouts',
    rows: ex.map((a, i) => albumRow({ ...a, xi: i }, s.id, { on: a.o })) });

  document.getElementById('v-detail').innerHTML = `
    <button class="back" data-back>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
      Ma collection</button>
    <div class="hero">
      <span class="art">${art(s)}</span>
      <span class="meta">
        <h2>${esc(s.name)}</h2>
        <p class="sub"><b id="d-c">${c}</b> sur ${t}${c >= t ? ' — complète' : `, il en manque ${t - c}`}</p>
        <span class="pbar${c >= t ? ' full' : ''}" id="d-bar"><i style="width:${t ? (c / t * 100).toFixed(1) : 0}%"></i></span>
      </span>
    </div>
    ${blocks.map(b => (b.label ? `<p class="section-label">${esc(b.label)}</p>` : '<div style="height:14px"></div>')
      + `<ul class="albums">${b.rows.join('')}</ul>`).join('')}
    <div class="btns" style="margin-top:18px">
      <button class="btn wide" data-add-album>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>

      ${s.custom ? '<button class="btn danger" data-del-serie>Supprimer la série</button>' : ''}
    </div>
    <div class="panel" id="add-album" hidden style="margin-top:14px">
      <p class="eyebrow">Nouvel album — ${esc(s.name)}</p>
      <div class="field">
        <input type="text" class="num" id="aa-n" inputmode="numeric" placeholder="N°" aria-label="Numéro">
        <input type="text" id="aa-t" placeholder="Titre de l’album" aria-label="Titre de l’album">
      </div>
      <div class="btns"><button class="btn" data-cancel>Annuler</button>
        <button class="btn pri" data-save-album disabled>Ajouter</button></div>
    </div>`;
}

function renderMissing() {
  const groups = allSeries().map(s => ({ s, m: missingOf(s) })).filter(g => g.m.length)
    .sort((a, b) => a.m.length - b.m.length || byName(a.s, b.s));
  const n = groups.reduce((k, g) => k + g.m.length, 0);
  document.getElementById('v-missing').innerHTML = !n
    ? `<p class="empty"><strong>Rien ne manque</strong>Toutes les séries de la liste sont complètes.</p>`
    : `<p class="eyebrow">Votre liste de courses</p>
       <p class="hint"><b class="tnum">${n}</b> albums ne sont pas encore chez vous. Les séries qui
          demandent le moins d’achats sont en premier. Touchez un album dès que vous l’avez.</p>
       ${groups.map(g => `<div data-grp="${esc(g.s.id)}">
         <div class="group-head"><span class="thumb">${art(g.s)}</span>
           <span class="gt">${esc(g.s.name)}</span>
           <span class="gn"><b data-gn>${g.m.length}</b> à trouver</span></div>
         <ul class="albums fade">${g.m.map(a => albumRow(a, g.s.id, { on: false })).join('')}</ul>
       </div>`).join('')}`;
}

function renderStats() {
  const all = allSeries();
  const t = all.reduce((k, s) => k + total(s), 0), c = all.reduce((k, s) => k + count(s), 0);
  const done = all.filter(s => count(s) >= total(s)).length;
  const near = all.map(s => ({ s, m: total(s) - count(s) })).filter(g => g.m > 0 && g.m <= 3)
    .sort((a, b) => a.m - b.m || byName(a.s, b.s));
  document.getElementById('v-stats').innerHTML = `
    <span class="pbar" style="height:14px"><i style="width:${t ? (c / t * 100).toFixed(1) : 0}%"></i></span>
    <p class="hint" style="margin-top:9px">${t ? (c / t * 100).toFixed(0) : 0} % de la liste est chez vous.</p>
    <div class="stats">
      <div class="stat have"><div class="k tnum">${c}</div><div class="l">albums possédés</div></div>
      <div class="stat gold"><div class="k tnum">${t - c}</div><div class="l">albums à trouver</div></div>
      <div class="stat"><div class="k tnum">${all.length}</div><div class="l">séries suivies</div></div>
      <div class="stat have"><div class="k tnum">${done}</div><div class="l">séries complètes</div></div>
    </div>
    ${near.length ? `<p class="eyebrow">Bientôt complètes</p>
      <p class="hint">Trois albums ou moins vous séparent de la série entière.</p>
      <ul class="shelf">${near.map(g => tile(g.s)).join('')}</ul>` : ''}`;
}

function renderSearch() {
  const q = norm(query.trim());
  if (!q) return;
  const hits = [];
  for (const s of allSeries()) {
    const inName = norm(s.name).includes(q), set = owned.get(s.id) || new Set();
    for (const a of s.albums)
      if (inName || norm(a.t).includes(q)) hits.push({ a, sid: s.id, on: set.has(a.k) });
    (extra.get(s.id) || []).forEach((a, i) => {
      if (inName || norm(a.t).includes(q)) hits.push({ a: { ...a, xi: i }, sid: s.id, on: a.o });
    });
    if (hits.length > 160) break;
  }
  const have = hits.filter(h => h.on).length;
  document.getElementById('v-search').innerHTML = hits.length
    ? `<p class="eyebrow">${hits.length} résultat${hits.length > 1 ? 's' : ''} — ${have} chez vous</p>
       <p class="hint">Touchez une ligne pour changer la réponse.</p>
       <ul class="albums">${hits.slice(0, 120).map(h =>
      albumRow(h.a, h.sid, { on: h.on, series: true, verdict: true })).join('')}</ul>`
    : `<p class="empty"><strong>Aucun album de ce nom</strong>
         Ce titre n’est pas dans la liste. Vérifiez l’orthographe, ou ajoutez la série
         depuis « Ma collection ».</p>`;
}

function updateTallies() {

  const t = all.reduce((k, s) => k + total(s), 0), c = all.reduce((k, s) => k + count(s), 0);
  document.getElementById('t-own').textContent = c;
  document.getElementById('t-tot').textContent = t;
  document.getElementById('tab-missing').textContent = t - c ? `(${t - c})` : '';
}

function render() {
  const searching = query.trim().length > 0;
  const name = searching ? 'search' : view.name;
  for (const v of ['search', 'shelf', 'detail', 'missing', 'stats'])
    document.getElementById('v-' + v).hidden = v !== name;
  ({ search: renderSearch, shelf: renderShelf, detail: renderDetail,
    missing: renderMissing, stats: renderStats })[name]();
  if (adding && !searching && view.name === 'shelf') renderAddPanel();
  updateTallies();
  document.getElementById('q-clear').hidden = !searching;
  for (const b of document.querySelectorAll('.tab'))
    b.setAttribute('aria-current',
      !searching && b.dataset.tab === (view.name === 'detail' ? 'shelf' : view.name) ? 'page' : 'false');
}

function toTop() {
  try { window.scrollTo(0, 0); } catch (e) {}
  const se = document.scrollingElement || document.documentElement;
  if (se) se.scrollTop = 0;
}
const go = (name, id) => { view = { name, id: id || null }; toTop(); render(); };

/* ================= cocher / décocher ================= */
function toggle(btn, sid, k, xi) {
  ensure(sid);
  let on;
  if (xi != null && xi !== '') {
    const a = extra.get(sid)[Number(xi)];
    if (!a) return;
    on = a.o = !a.o;
  } else {
    const set = owned.get(sid);
    on = !set.has(k);
    on ? set.add(k) : set.delete(k);
  }
  queueWrite(sid);

  // mise à jour sur place : la liste ne se reconstruit pas sous le doigt
  btn.setAttribute('aria-pressed', String(on));
  const v = btn.querySelector('.verdict');
  if (v) v.textContent = on ? 'Vous l’avez' : 'Pas encore';
  updateTallies();

  if (view.name === 'detail' && !query.trim()) {
    const s = serie(sid), c = count(s), t = total(s);
    const cEl = document.getElementById('d-c'), bar = document.getElementById('d-bar');
    if (cEl) cEl.parentNode.innerHTML =
      `<b id="d-c">${c}</b> sur ${t}${c >= t ? ' — complète' : `, il en manque ${t - c}`}`;
    if (bar) { bar.classList.toggle('full', c >= t); bar.firstElementChild.style.width = (t ? c / t * 100 : 0) + '%'; }
  }
  if (view.name === 'missing' && !query.trim() && on) {
    const li = btn.parentNode, grp = li.closest('[data-grp]');
    li.style.opacity = '0'; li.style.transform = 'translateX(14px)';
    setTimeout(() => {
      li.remove();
      if (grp && !grp.querySelector('.al')) grp.remove();
      else if (grp) grp.querySelector('[data-gn]').textContent = grp.querySelectorAll('.al').length;
      if (!document.querySelector('#v-missing .al')) renderMissing();
    }, 200);
  }
  if (view.name === 'stats' && !query.trim()) renderStats();
}

/* ================= ajouter une série ================= */
function renderAddPanel() {
  const host = document.getElementById('v-shelf');
  let p = document.getElementById('add-serie');
  if (!p) { p = document.createElement('div'); p.id = 'add-serie'; host.prepend(p); }
  const a = adding;
  if (a.step === 'ask') {
    p.innerHTML = `<div class="panel">
      <h3>Ajouter une série</h3>
      <p class="note">Tapez le nom de la série, puis choisissez : soit l’application vous
         propose la liste de ses albums, soit vous la saisissez vous-même.</p>
      <div class="field"><input type="text" id="as-q" placeholder="Ex. : Les Vieux Fourneaux"
        aria-label="Nom de la série" value="${esc(a.q || '')}"></div>
      ${a.err ? `<p class="note warn">${esc(a.err)}</p>` : ''}
      <div class="btns">
        <button class="btn pri wide" data-add-find>Proposer les albums</button>
        <button class="btn wide" data-add-manual>Saisir à la main</button>
      </div>
      <div class="btns"><button class="btn" data-add-cancel>Annuler</button></div>
    </div>`;
  } else if (a.step === 'load') {
    p.innerHTML = `<div class="panel"><h3>Recherche…</h3>
      <p class="note" style="display:flex;align-items:center;gap:10px">
        <span class="spin"></span> Je cherche les albums de « ${esc(a.q)} ».</p></div>`;
  } else {
    const next = a.albums.length ? Math.max(...a.albums.map(x => x.n || 0)) + 1 : 1;
    p.innerHTML = `<div class="panel">
      <h3>Nouvelle série</h3>
      <div class="field"><input type="text" id="as-name" value="${esc(a.name || '')}"
        placeholder="Nom de la série" aria-label="Nom de la série"></div>
      ${a.fromAI ? `<p class="note warn">Liste proposée automatiquement : vérifiez-la, elle peut
         comporter des erreurs ou des oublis. Corrigez-la librement ci-dessous.</p>` : ''}
      ${a.albums.length ? `<ul class="prop">${a.albums.map((al, i) => `<li>
          <span class="pn tnum">${al.n}</span><span class="pt">${esc(al.t)}</span>
          <button class="rm" data-rm="${i}" aria-label="Retirer ${esc(al.t)}">×</button></li>`).join('')}</ul>
        <p class="note">${a.albums.length} album${a.albums.length > 1 ? 's' : ''}. Ils seront ajoutés
           comme « pas encore chez vous » : vous les cocherez ensuite.</p>`
      : '<p class="note">Aucun album pour l’instant. Ajoutez-les ci-dessous.</p>'}

      <p class="eyebrow" style="margin:4px 0 0">Ajouter un album</p>
      <div class="field">
        <input type="text" class="num" id="ae-n" inputmode="numeric" value="${next}" aria-label="Numéro">
        <input type="text" id="ae-t" placeholder="Titre de l’album" aria-label="Titre de l’album">
        <button class="btn ae-add" data-ae-add aria-label="Ajouter cet album">+</button>
      </div>

      <details${a.paste ? ' open' : ''}>
        <summary>Coller plusieurs titres d’un coup</summary>
        <p class="note" style="margin:8px 0">Un titre par ligne, dans l’ordre des tomes.
           Un numéro en début de ligne est repris tel quel.</p>
        <textarea id="ae-paste" placeholder="Ceux qui restent&#10;Bonny and Pierrot&#10;Celui qui part"
          aria-label="Liste de titres à coller"></textarea>
        <div class="btns" style="margin-top:9px">
          <button class="btn" data-ae-paste>Ajouter ces titres</button></div>
      </details>
      ${a.err ? `<p class="note warn">${esc(a.err)}</p>` : ''}
      <div class="btns"><button class="btn" data-add-cancel>Annuler</button>
        <button class="btn pri" data-add-save${a.albums.length ? '' : ' disabled'}>Créer la série</button></div>
    </div>`;
  }
}

/* Garde ce que l'utilisatrice a tapé avant que le panneau ne se reconstruise. */
function syncAddName() {
  const el = document.getElementById('as-name');
  if (el && adding) adding.name = el.value;
}

async function findSerie(name) {
  adding = { step: 'load', q: name };
  render();
  try {
    sampler = sampler || await window.claude?.use?.('sample');
    if (!sampler) throw { code: 'not_granted' };
    const out = await sampler.json(
      `Tu connais la bande dessinée franco-belge, les comics et les mangas.\n` +
      `Donne la liste des albums de la série « ${name} », dans l'ordre de parution.\n` +
      `Réponds UNIQUEMENT par un objet JSON de la forme :\n` +
      `{"serie":"nom exact de la série","albums":[{"n":1,"t":"titre du tome 1"}]}\n` +
      `N'invente aucun titre. Si tu ne connais pas cette série, réponds {"serie":"","albums":[]}.`);
    const albums = (out && Array.isArray(out.albums) ? out.albums : [])
      .filter(a => a && typeof a.t === 'string' && a.t.trim())
      .map((a, i) => ({ n: Number(a.n) || i + 1, t: String(a.t).trim() })).slice(0, 300);
    if (!albums.length) {
      adding = { step: 'edit', q: name, name, albums: [],
        err: `Aucun album trouvé pour « ${name} ». Saisissez-les vous-même ci-dessous.` };
    } else {
      adding = { step: 'edit', q: name, name: (out.serie || name).trim(), albums, fromAI: true };
    }
  } catch (e) {
    const m = { not_granted: 'La proposition automatique n’est pas disponible ici. Saisissez les albums vous-même ci-dessous.',
      rate_limited: 'Trop de recherches d’affilée. Réessayez dans un moment, ou saisissez les albums vous-même.' };
    adding = { step: 'edit', q: name, name, albums: [],
      err: m[e && e.code] || 'La recherche n’a pas abouti. Saisissez les albums vous-même ci-dessous.' };
  }
  render();
}

/* Une ligne collée peut commencer par son numéro : « 3. Le titre », « 3 - Le titre ». */
function parsePasted(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(\d{1,3})\s*[.)\-–—:]?\s+(.+)$/);
    return m ? { n: Number(m[1]), t: m[2].trim() } : { n: null, t: l };
  });
}

async function saveSerie() {
  const a = adding, name = (a.name || a.q || '').trim();
  if (!name || !a.albums.length) return;
  let id = slug(name), i = 2;
  while (serie(id)) id = slug(name) + '-' + i++;
  const rec = { id, name, albums: a.albums.map((al, n) => ({ k: `0.${al.n || n + 1}`, n: al.n || n + 1, t: al.t })) };
  applyAdded(rec);
  adding = null;
  stamp.set(id, Date.now());
  saveLocal();
  if (db && canWrite !== false) {
    setSync('saving');
    try {
      await db.doc('custom/' + id).set({ ...rec, at: Date.now() });
      await db.doc('series/' + id).set({ owned: [], extra: [], at: stamp.get(id) });
      setSync('ok');
    } catch (e) { setSync(e && e.code === 'invalid_argument' ? 'local' : 'retry'); }
  }
  go('detail', id);
}

async function delSerie(id) {
  if (!added.has(id)) return;
  added.delete(id); owned.delete(id); extra.delete(id); stamp.delete(id);
  saveLocal();
  if (db && canWrite !== false) {
    try { await db.doc('custom/' + id).delete(); await db.doc('series/' + id).delete(); } catch (e) {}
  }
  go('shelf');
}

/* ================= interactions ================= */
document.addEventListener('click', e => {
  const al = e.target.closest('.al');
  if (al) return toggle(al, al.dataset.s, al.dataset.k, al.dataset.x);

  const t = e.target.closest('[data-go]');
  if (t) return go('detail', t.dataset.go);
  if (e.target.closest('[data-back]')) return go('shelf');

  const chip = e.target.closest('.chip');
  if (chip) { filter = chip.dataset.f; return render(); }

  const tab = e.target.closest('.tab');
  if (tab) {
    query = ''; document.getElementById('q').value = ''; adding = null;
    try { localStorage.setItem(LS + '.tab', tab.dataset.tab); } catch (err) {}
    return go(tab.dataset.tab);
  }
  if (e.target.closest('#q-clear')) {
    query = ''; document.getElementById('q').value = ''; render();
    return document.getElementById('q').focus();
  }

  /* ajout d'un album isolé */
  if (e.target.closest('[data-add-album]')) {
    const p = document.getElementById('add-album');
    p.hidden = false; e.target.closest('[data-add-album]').hidden = true;
    return document.getElementById('aa-t').focus();
  }
  if (e.target.closest('[data-cancel]')) {
    document.getElementById('add-album').hidden = true;
    document.querySelector('[data-add-album]').hidden = false; return;
  }
  if (e.target.closest('[data-save-album]')) {
    const ti = document.getElementById('aa-t').value.trim();
    const n = parseInt(document.getElementById('aa-n').value, 10);
    if (!ti) return;
    ensure(view.id);
    extra.get(view.id).push({ n: Number.isFinite(n) ? n : 0, t: ti, o: true });
    queueWrite(view.id); return render();
  }

  /* ajout d'une série entière */
  if (e.target.closest('[data-add-serie]')) {
    adding = { step: 'ask', q: '' }; toTop(); render();
    document.getElementById('add-serie')?.scrollIntoView({ block: 'start' });
    return document.getElementById('as-q')?.focus();
  }
  if (e.target.closest('[data-add-cancel]')) { adding = null; return render(); }
  if (e.target.closest('[data-add-find]')) {
    const v = document.getElementById('as-q').value.trim();
    if (v.length < 2) { adding = { step: 'ask', q: v, err: 'Tapez au moins deux lettres.' }; return render(); }
    return findSerie(v);
  }
  if (e.target.closest('[data-add-manual]')) {
    const v = document.getElementById('as-q').value.trim();
    if (v.length < 2) { adding = { step: 'ask', q: v, err: 'Tapez d’abord le nom de la série.' }; return render(); }
    adding = { step: 'edit', q: v, name: v, albums: [] };
    render();
    return document.getElementById('ae-t')?.focus();
  }
  const rm = e.target.closest('[data-rm]');
  if (rm) { syncAddName(); adding.albums.splice(Number(rm.dataset.rm), 1); return render(); }

  if (e.target.closest('[data-ae-add]')) {
    syncAddName();
    const t = document.getElementById('ae-t').value.trim();
    const n = parseInt(document.getElementById('ae-n').value, 10);
    if (!t) { adding.err = 'Tapez le titre de l’album.'; return render(); }
    adding.err = null;
    adding.albums.push({ n: Number.isFinite(n) ? n : adding.albums.length + 1, t });
    render();
    return document.getElementById('ae-t')?.focus();
  }
  if (e.target.closest('[data-ae-paste]')) {
    syncAddName();
    const lignes = parsePasted(document.getElementById('ae-paste').value);
    if (!lignes.length) { adding.err = 'Collez au moins un titre.'; adding.paste = true; return render(); }
    let suivant = adding.albums.length ? Math.max(...adding.albums.map(x => x.n || 0)) + 1 : 1;
    for (const l of lignes) adding.albums.push({ n: l.n != null ? l.n : suivant++, t: l.t });
    adding.err = null; adding.paste = true;
    return render();
  }
  if (e.target.closest('[data-add-save]')) { syncAddName(); return saveSerie(); }

  const del = e.target.closest('[data-del-serie]');
  if (del) {
    if (del.dataset.sure) return delSerie(view.id);
    del.dataset.sure = '1'; del.textContent = 'Confirmer la suppression';
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { query = e.target.value; render(); }
  if (e.target.id === 'aa-t') {
    const b = document.querySelector('[data-save-album]');
    if (b) b.disabled = !e.target.value.trim();
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'as-q') { e.preventDefault(); document.querySelector('[data-add-find]')?.click(); }
  if (e.target.id === 'ae-t' || e.target.id === 'ae-n') {
    e.preventDefault(); document.querySelector('[data-ae-add]')?.click();
  }
  if (e.target.id === 'aa-t' || e.target.id === 'aa-n') {
    e.preventDefault(); document.querySelector('[data-save-album]')?.click();
  }
});

/* ================= démarrage ================= */
const local = readLocal();
if (local) {
  (local.added || []).forEach(applyAdded);
  for (const id in (local.state || {})) applyState(id, local.state[id], false);
}
try {
  const tb = localStorage.getItem(LS + '.tab');
  if (['shelf', 'missing', 'stats'].includes(tb)) view = { name: tb, id: null };
} catch (e) {}
setSync(local ? 'local' : 'ok');
render();

(async () => {
  const user = await window.claude?.use?.('user');
  if (user) { try { canWrite = await user.can('data.write'); } catch (e) {} }

  db = await window.claude?.use?.('db');
  if (!db) { setSync('local'); return; }

  db.collection('custom').onSnapshot(snap => {
    let changed = false;
    for (const d of snap.docs) changed = applyAdded({ id: d.id, ...d.data() }) || changed;
    if (changed) { saveLocal(); render(); }
  }, () => {});

  db.collection('series').onSnapshot(snap => {
    let changed = false;
    for (const d of snap.docs) changed = applyState(d.id, d.data(), true) || changed;
    if (changed) { saveLocal(); render(); }
    if (!pending.size) setSync(canWrite === false ? 'local' : 'ok');
  }, err => { if (err.code !== 'unavailable') setSync('local'); });
})();
</script>
