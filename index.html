<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma collection de BD</title>
<meta name="description" content="La collection de bandes dessinées : cocher ce qu'on a, voir ce qui manque.">
<meta name="theme-color" content="#EFEDE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111823" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>📚</text></svg>">
<link rel="apple-touch-icon" href="covers/asterix.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes BD">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Ma collection de BD</h1>
      <p class="tally" id="tally"><b id="t-own">—</b> / <span class="tnum" id="t-tot">—</span></p>
    </div>
    <div class="search" id="search">
      <span class="ico" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></span>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search"
             placeholder="Un titre ? Tapez-le ici" aria-label="Chercher un album ou une série">
      <button class="clr" id="q-clear" hidden aria-label="Effacer la recherche">×</button>
    </div>
    <p class="sync" id="sync" data-s="local">
      <span class="dot"></span><span id="sync-t">Chargement…</span>
      <button class="link" id="auth-btn" hidden></button>
    </p>
  </div>
</header>

<main id="main">
  <section id="v-boot"><p class="empty"><strong>Un instant</strong>Je vais chercher la collection.</p></section>
  <section id="v-auth" hidden aria-label="Connexion"></section>
  <section id="v-search" hidden aria-label="Résultats de recherche"></section>
  <section id="v-shelf" hidden aria-label="Ma collection"></section>
  <section id="v-detail" hidden aria-label="Détail d'une série"></section>
  <section id="v-missing" hidden aria-label="Albums à trouver"></section>
  <section id="v-stats" hidden aria-label="Bilan"></section>
</main>

<nav class="tabs" aria-label="Navigation" hidden id="tabs">
  <button class="tab" data-tab="shelf" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h5v16H4zM10.5 4h5v16h-5z"/><path d="m17 4.6 4 1.1-3.4 15.1-4-1.1z"/></svg>
    <span>Ma collection</span>
  </button>
  <button class="tab" data-tab="missing">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 12h14M5 17h7"/><path d="M17.5 15.5v5M15 18h5"/></svg>
    <span>À trouver <span class="cnt" id="tab-missing"></span></span>
  </button>
  <button class="tab" data-tab="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Bilan</span>
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
